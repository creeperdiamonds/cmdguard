name: build

on:
  # Every branch, not just the default one. A feature branch that only ever built on
  # one developer's machine has not been verified anywhere reproducible -- and this
  # project's mixin targets cannot be checked by a build at all, so the least it can do
  # is prove it compiles on a clean checkout with a known JDK.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: cmdguard-jar
          path: build/libs/*.jar
          if-no-files-found: error
